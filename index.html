<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비정형 텍스트 패턴 추출기</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  p.lead { color: #666; }
  section {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
  }
  h2 { font-size: 1.1rem; margin-top: 0; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 60px;
    font-size: 1rem;
    padding: 8px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  button {
    padding: 8px 16px;
    cursor: pointer;
  }
  button.secondary { color: #666; }
  pre {
    background: #f5f5f5;
    padding: 8px;
    border-radius: 4px;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 1.2em;
    margin-top: 8px;
    transition: background-color 0.3s;
  }
  pre.flash { background-color: #dff0d8; }
  footer { color: #888; font-size: 0.85rem; margin-top: 32px; }
</style>
</head>
<body>
  <h1>비정형 텍스트 패턴 추출기</h1>
  <p class="lead">서버 없이 브라우저에서 정규식·문자열 알고리즘만으로 동작합니다.</p>

  <section>
    <h2>계좌번호 추출</h2>
    <textarea id="account-input" placeholder="예: 국민은행 123-456-789012 로 보내주세요"></textarea>
    <div class="btn-row">
      <button id="account-btn">추출</button>
      <button id="account-copy" class="secondary">복사</button>
      <button id="account-clear" class="secondary">지우기</button>
    </div>
    <pre id="account-result"></pre>
  </section>

  <section>
    <h2>전화번호 추출</h2>
    <textarea id="phone-input" placeholder="예: 연락처는 010.1234.5678 이에요"></textarea>
    <div class="btn-row">
      <button id="phone-btn">추출</button>
      <button id="phone-copy" class="secondary">복사</button>
      <button id="phone-clear" class="secondary">지우기</button>
    </div>
    <pre id="phone-result"></pre>
  </section>

  <section>
    <h2>해시태그 생성</h2>
    <textarea id="hashtag-input" placeholder="예: 오늘 날씨가 진짜 좋다 날씨 최고"></textarea>
    <div class="btn-row">
      <button id="hashtag-btn">생성</button>
      <button id="hashtag-copy" class="secondary">복사</button>
      <button id="hashtag-clear" class="secondary">지우기</button>
    </div>
    <pre id="hashtag-result"></pre>
  </section>

  <section>
    <h2>자연어 날짜 변환</h2>
    <textarea id="date-input" placeholder="예: 다다음 주 금요일 오후 3시"></textarea>
    <div class="btn-row">
      <button id="date-btn">변환</button>
      <button id="date-copy" class="secondary">복사</button>
      <button id="date-clear" class="secondary">지우기</button>
    </div>
    <pre id="date-result"></pre>
  </section>

  <footer>
    소스: <a href="https://github.com/jiyeongxxxkim/text-pattern-extractor">GitHub</a>
  </footer>

  <script type="module">
    import { extractAccount } from './src/lib/extractAccount.js';
    import { extractPhone } from './src/lib/extractPhone.js';
    import { generateHashtags } from './src/lib/generateHashtags.js';
    import { parseDate } from './src/lib/parseDate.js';

    function setupSection({ prefix, run, format }) {
      const input = document.getElementById(`${prefix}-input`);
      const result = document.getElementById(`${prefix}-result`);
      const copyBtn = document.getElementById(`${prefix}-copy`);

      document.getElementById(`${prefix}-btn`).addEventListener('click', () => {
        result.textContent = format(run(input.value));
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        result.classList.remove('flash');
        // eslint-disable-next-line no-unused-expressions
        result.offsetHeight; // 리플로우 강제 — 연속 클릭 시에도 flash 애니메이션이 재시작되도록
        result.classList.add('flash');
      });

      document.getElementById(`${prefix}-clear`).addEventListener('click', () => {
        input.value = '';
        result.textContent = '';
        result.classList.remove('flash');
        input.focus();
      });

      copyBtn.addEventListener('click', async () => {
        if (!result.textContent) return;
        try {
          await navigator.clipboard.writeText(result.textContent);
          const original = copyBtn.textContent;
          copyBtn.textContent = '복사됨!';
          setTimeout(() => { copyBtn.textContent = original; }, 1200);
        } catch {
          copyBtn.textContent = '복사 실패';
          setTimeout(() => { copyBtn.textContent = '복사'; }, 1200);
        }
      });
    }

    setupSection({
      prefix: 'account',
      run: extractAccount,
      format: (r) => JSON.stringify(r, null, 2),
    });
    setupSection({
      prefix: 'phone',
      run: extractPhone,
      format: (r) => r ?? '(인식 불가)',
    });
    setupSection({
      prefix: 'hashtag',
      run: generateHashtags,
      format: (r) => r.join(' ') || '(결과 없음)',
    });
    setupSection({
      prefix: 'date',
      run: parseDate,
      format: (r) => r ?? '(인식 불가)',
    });
  </script>
</body>
</html>
